name: Compilar APK de RoykolaVisor

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 11 (Requerido para Gradle 7.4)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Configurar Gradle en el Servidor
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 7.4.2

    - name: Compilar APK con Gradle Global
      run: gradle assembleDebug

    - name: Subir la APK generada a GitHub
      uses: actions/upload-artifact@v4
      with:
        name: RoykolaVisor-APK-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
