name: Compilar APK de RoykolaVisor

on:
  push:
    branches: [ main, master ] # Se ejecutará cada vez que subas cambios a estas ramas
  workflow_dispatch: # Permite compilar manualmente con un botón

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 11 (Requerido para Gradle 7.4)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Dar permisos de ejecución al script de Gradle
      run: chmod +x gradlew
      continue-on-error: true

    - name: Compilar APK con Gradle
      run: ./gradlew assembleDebug

    - name: Subir la APK generada a GitHub
      uses: actions/upload-artifact@v4
      with:
        name: RoykolaVisor-APK-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
