name: Compilar APK de RoykolaVisor

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 11 (Compatible con Java 8 del proyecto)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Configurar Gradle en el Servidor
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 7.6

    - name: Compilar APK Debug con Gradle Global
      run: gradle assembleDebug --stacktrace

    - name: Compilar APK Release con Gradle Global
      run: gradle assembleRelease --stacktrace

    - name: Subir la APK Debug generada a GitHub
      uses: actions/upload-artifact@v4
      with:
        name: RoykolaVisor-APK-Debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Subir la APK Release generada a GitHub
      uses: actions/upload-artifact@v4
      with:
        name: RoykolaVisor-APK-Release
        path: app/build/outputs/apk/release/app-release-unsigned.apk

    - name: Obtener información de las APKs
      run: |
        echo "=== Debug APK ==="
        ls -lh app/build/outputs/apk/debug/app-debug.apk || echo "Debug APK no encontrada"
        echo "=== Release APK ==="
        ls -lh app/build/outputs/apk/release/app-release-unsigned.apk || echo "Release APK no encontrada"
